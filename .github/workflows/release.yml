name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: validate + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate version + ensure it's new
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must look like v1.2.3 (got '$VERSION')"; exit 1; }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists"; exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build release binary (linux/amd64, version-stamped)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/clouvet/sprite-swarm/internal/buildinfo.Tag=$VERSION" \
            -o sprite-agent ./cmd/sprite-agent
      - name: Create release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" sprite-agent \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
